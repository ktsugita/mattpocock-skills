name: Flatten Skills for Antigravity

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flatten skills, setup plugin.json and banner
        run: |
          python3 -c "
          import os, shutil

          skills_dir = 'skills'
          if os.path.exists(skills_dir):
              categories = [d for d in os.listdir(skills_dir) if os.path.isdir(os.path.join(skills_dir, d))]
              for cat in categories:
                  cat_path = os.path.join(skills_dir, cat)
                  for item in os.listdir(cat_path):
                      src = os.path.join(cat_path, item)
                      dst = os.path.join(skills_dir, item)
                      if os.path.isdir(src):
                          shutil.move(src, dst)
                  shutil.rmtree(cat_path)

          if os.path.exists('.claude-plugin/plugin.json'):
              shutil.copy('.claude-plugin/plugin.json', 'plugin.json')

          if os.path.exists('README.md'):
              with open('README.md', 'r', encoding='utf-8') as f:
                  readme_content = f.read()
              banner = '''# Matt Pocock Skills (Antigravity CLI Edition)

> [!NOTE]
> This branch is automatically flattened for Antigravity CLI (\`agy\`).
>
> \`\`\`bash
> agy plugin install https://github.com/ktsugita/mattpocock-skills/tree/agy mattpocock-skills
> \`\`\`

---

'''
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(banner + readme_content)
          "

      - name: Push to agy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B agy
          git add -A
          git commit -m "Auto-flatten skills for Antigravity CLI" || exit 0
          git push origin agy --force
