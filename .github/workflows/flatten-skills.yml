name: Flatten Skills for Antigravity

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Flatten skills, setup plugin.json and banner
        run: python3 scripts/flatten-skills.py

      - name: Push to agy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B agy
          git add -A
          git commit -m "Auto-flatten skills for Antigravity CLI" || exit 0
          git push origin agy --force
